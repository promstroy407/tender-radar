# Выкладка на сервер после успешного CI на main (или вручную).
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: server

jobs:
  deploy:
    # Выкладка включается переменной репозитория DEPLOY_ENABLED=true после настройки сервера.
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ключ SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Скопировать код
        run: |
          git log -1 --format='%h %s' > REVISION
          rsync -az --delete \
            --exclude .git --exclude .env --exclude vendor \
            --exclude 'storage/app/*' --exclude 'storage/logs/*' --exclude 'storage/framework/*' \
            ./ deploy@${{ vars.SERVER_HOST }}:/opt/tender-radar/

      - name: Выкладка
        run: ssh deploy@${{ vars.SERVER_HOST }} 'bash /opt/tender-radar/scripts/server/deploy.sh'
