name: parser-tools

# Набор библиотек (только открытый код) для проверки разбора смет вне Docker:
# в рабочей среде нет доступа к Packagist. Документы заказчика сюда не попадают —
# архив библиотек скачивается и разбор запускается там, где лежат файлы.
on:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Библиотеки для разбора
        run: |
          mkdir tools && cd tools
          composer init --name=tender/parser-tools --no-interaction
          composer config platform.php 8.3.6
          composer require --no-interaction --no-progress \
            "phpoffice/phpspreadsheet:^5.0" "illuminate/database:^13.0" \
            "illuminate/process:^13.0" "illuminate/support:^13.0"

      # Архивы Actions из рабочей среды не скачиваются, поэтому — отдельной веткой без истории.
      - name: Ветка tools/parser-vendor
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd tools
          git init -q -b tools/parser-vendor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor composer.json composer.lock
          git commit -qm "Библиотеки для проверки разбора смет"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tools/parser-vendor
