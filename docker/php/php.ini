memory_limit = 512M
; Документация тендера: сметы и проекты до 64 МБ, несколько файлов за раз.
upload_max_filesize = 64M
post_max_size = 200M
max_file_uploads = 20
expose_php = Off
date.timezone = Europe/Moscow

opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
