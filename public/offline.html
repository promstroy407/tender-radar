<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1D5BD8">
    <title>Нет связи — Тендер-Радар</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F3F4F6; color:#14181F; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
        .card { background:#fff; border:1px solid #E3E6EA; border-radius:16px; padding:24px; max-width:360px; text-align:center; }
        img { width:64px; height:64px; border-radius:14px; }
        h1 { font-size:20px; margin:12px 0 6px; }
        p { color:#5B6472; margin:0 0 16px; }
        button { min-height:44px; border:0; border-radius:12px; padding:0 18px; font:inherit; font-weight:600; background:#1D5BD8; color:#fff; cursor:pointer; }
    </style>
</head>
<body>
<div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Нет связи с сервером</h1>
    <p>Проверьте интернет и попробуйте ещё раз.</p>
    <button type="button" onclick="location.reload()">Обновить</button>
</div>
</body>
</html>
